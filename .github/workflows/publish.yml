name: Publish to PyPI

on:
  release:
    types: [published]   # triggers when you publish a GitHub Release

  workflow_dispatch:     # allows manual trigger from the Actions tab

jobs:
  # ── 1. Run tests before publishing ────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # ── 2. Build distribution ─────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test          # only build if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 3. Publish to PyPI via Trusted Publishing (OIDC — no API token needed) ─
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi          # optional: add a GitHub "pypi" environment for approval gates
    permissions:
      id-token: write          # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed — PyPI Trusted Publishing uses OIDC.
        # Setup at: https://pypi.org/manage/account/publishing/
        # Add a "pending publisher":
        #   PyPI project name : token-analysis
        #   GitHub owner      : Manjugadupudi
        #   GitHub repo       : Token_analyzer
        #   Workflow filename : publish.yml
        #   Environment name  : pypi  (optional)
